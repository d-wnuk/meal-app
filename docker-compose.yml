services:
  backend:
    build: ./backend
    container_name: meal_backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

  db:
    image: postgres:15
    container_name: meal_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_BASE_PATH: ${VITE_APP_BASE_PATH:-/}
    container_name: meal_frontend
    restart: always
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-20178}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
